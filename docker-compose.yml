services:
  baza:
    image: postgres:16-alpine
    container_name: kontener_baza
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - wolumen_bazy:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: kontener_backend
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      - baza

  frontend:
    build: ./frontend
    container_name: kontener_frontend
    restart: always
    environment:
      - BACKEND_URL=${BACKEND_URL}
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  wolumen_bazy: